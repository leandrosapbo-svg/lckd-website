<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get the LCKD App | LCKD Qatar</title>
<meta name="description" content="Download the LCKD Qatar app on the App Store or Google Play.">

<meta property="og:type" content="website">
<meta property="og:url" content="https://lckd.qa/app">
<meta property="og:title" content="Get the LCKD app">
<meta property="og:description" content="Download the LCKD Qatar app on the App Store or Google Play.">
<meta property="og:image" content="https://lckd.qa/assets/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="data:,">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="/" class="wordmark">LCKD</a>
    <nav class="nav" id="nav">
      <a href="/#method">The Concept</a>
      <a href="/#lab">LCKD Lab</a>
      <a href="/#location">Location</a>
      <a href="/#contact" class="nav-cta">Lock In</a>
    </nav>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main>
  <section class="app-page">
    <div class="wrap app-inner">
      <p class="eyebrow center">The LCKD app</p>
      <h1 class="app-head">Lock in on<br>your phone.</h1>
      <p class="lede">Download the LCKD Qatar app and take your training with you.</p>
      <div class="store-row">
        <a class="store-btn" href="https://apps.apple.com/qa/app/lckd-qatar/id6814395255" target="_blank" rel="noopener">
          <span class="store-small">Download on the</span>
          <span class="store-name">App Store</span>
        </a>
        <a class="store-btn" href="https://play.google.com/store/apps/details?id=com.g8ts.android.LCDK" target="_blank" rel="noopener">
          <span class="store-small">Get it on</span>
          <span class="store-name">Google Play</span>
        </a>
      </div>
      <p class="store-status" id="storeStatus" hidden></p>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span class="wordmark small">LCKD</span>
    <p>Porto Arabia, The Pearl · Doha</p>
    <p class="copyright">&copy; 2026 LCKD</p>
  </div>
</footer>

<script src="/script.js"></script>
<script>
(function () {
  var ua = navigator.userAgent || '';
  var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  var stores = document.querySelectorAll('.store-btn');
  var target = isIOS ? stores[0] : isAndroid ? stores[1] : null;
  if (!target || !/^https?:\/\//.test(target.getAttribute('href'))) return;

  var status = document.getElementById('storeStatus');
  status.textContent = 'Taking you to ' + (isIOS ? 'the App Store' : 'Google Play') + '…';
  status.hidden = false;
  window.location.replace(target.href);
})();
</script>
</body>
</html>
