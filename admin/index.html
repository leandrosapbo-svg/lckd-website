<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0a">
<meta name="color-scheme" content="dark">
<title>LCKD Admin</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<section id="login" class="login" hidden>
  <div class="login-card">
    <p class="brand brand-big">LCKD</p>
    <h1>Coach login</h1>
    <a id="googleBtn" class="gbtn" href="/api/admin/auth/google" hidden>
      <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      <span>Sign in with Google</span>
    </a>
    <p id="loginNotice" class="error" role="alert" hidden></p>
    <details id="pwBox" class="pwbox" hidden>
      <summary>Use the shared password</summary>
      <form id="loginForm" autocomplete="on">
        <label for="user">Username</label>
        <input id="user" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        <label for="pass">Password</label>
        <div class="pass-wrap">
          <input id="pass" name="password" type="password" autocomplete="current-password" required>
          <button type="button" id="togglePass" class="ghost" aria-label="Show password">Show</button>
        </div>
        <p id="loginError" class="error" role="alert" hidden></p>
        <button type="submit" id="loginBtn" class="primary">Sign in</button>
      </form>
    </details>
    <p class="legal-links">For LCKD coaches and management only.<br><a href="/admin/privacy/">Privacy Policy</a> &middot; <a href="/admin/terms/">Terms of Service</a></p>
  </div>
</section>

<section id="main" hidden>
  <header class="top">
    <div class="bar">
      <span class="brand">LCKD <small>Bookings</small></span>
      <div class="bar-actions">
        <button type="button" id="special" class="icon party" aria-label="Celebrations" aria-haspopup="dialog" hidden>
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>
          <span id="specialN" class="pbadge" aria-hidden="true"></span>
        </button>
        <button type="button" id="refresh" class="icon" aria-label="Refresh">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
        </button>
        <button type="button" id="account" class="icon acct" aria-label="Account" aria-haspopup="dialog"><span id="acctInitial" aria-hidden="true">?</span></button>
      </div>
    </div>
    <div class="searchrow" id="searchRow">
      <div class="search">
        <svg class="mag" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" inputmode="search" enterkeyhint="search" placeholder="Search students: name or phone" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="60" aria-label="Search students by name or phone number" aria-controls="results">
        <button type="button" id="qClear" class="qclear" aria-label="Clear search" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="results" class="results" hidden></div>
    </div>
    <div class="daynav">
      <button type="button" id="prev" class="nav" aria-label="Previous day">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="daycenter">
        <div class="datewrap">
          <button type="button" id="dayBtn" class="daylabel" aria-label="Pick a date">
            <span id="dayName" class="day-name">&nbsp;</span>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          </button>
          <input type="date" id="datePick" class="datepick" aria-label="Choose a date" tabindex="-1">
        </div>
        <button type="button" id="dayTag" class="day-tag"></button>
      </div>
      <button type="button" id="next" class="nav" aria-label="Next day">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </header>

  <p id="sampleBanner" class="sample" hidden>Sample data. These are not real bookings.</p>

  <main id="content" class="content" aria-live="polite"></main>
</section>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet-panel" id="sheetPanel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab" aria-hidden="true"></div>
    <div class="sheet-head">
      <div>
        <p id="sheetKind" class="sheet-kind"></p>
        <h2 id="sheetTitle"></h2>
        <p id="sheetSub"></p>
      </div>
      <div class="sheet-tools">
        <span id="sheetActions"></span>
        <button type="button" class="icon" id="sheetClose" data-close aria-label="Close">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>

<script src="/admin/admin.js" defer></script>
</body>
</html>
