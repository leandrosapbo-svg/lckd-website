<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0a">
<meta name="color-scheme" content="dark">
<title>LCKD Admin</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<section id="login" class="login" hidden>
  <form id="loginForm" class="login-card" autocomplete="on">
    <p class="brand brand-big">LCKD</p>
    <h1>Coach login</h1>
    <label for="user">Username</label>
    <input id="user" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <label for="pass">Password</label>
    <div class="pass-wrap">
      <input id="pass" name="password" type="password" autocomplete="current-password" required>
      <button type="button" id="togglePass" class="ghost" aria-label="Show password">Show</button>
    </div>
    <p id="loginError" class="error" role="alert" hidden></p>
    <button type="submit" id="loginBtn" class="primary">Sign in</button>
  </form>
</section>

<section id="main" hidden>
  <header class="top">
    <div class="bar">
      <span class="brand">LCKD <small>Bookings</small></span>
      <div class="bar-actions">
        <button type="button" id="refresh" class="icon" aria-label="Refresh">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
        </button>
        <button type="button" id="logout" class="ghost">Sign out</button>
      </div>
    </div>
    <div class="daynav">
      <button type="button" id="prev" class="nav" aria-label="Previous day">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="daycenter">
        <div class="datewrap">
          <button type="button" id="dayBtn" class="daylabel" aria-label="Pick a date">
            <span id="dayName" class="day-name">&nbsp;</span>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          </button>
          <input type="date" id="datePick" class="datepick" aria-label="Choose a date" tabindex="-1">
        </div>
        <button type="button" id="dayTag" class="day-tag"></button>
      </div>
      <button type="button" id="next" class="nav" aria-label="Next day">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </header>

  <p id="sampleBanner" class="sample" hidden>Sample data. These are not real bookings.</p>

  <main id="content" class="content" aria-live="polite"></main>
</section>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet-panel" id="sheetPanel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab" aria-hidden="true"></div>
    <div class="sheet-head">
      <div>
        <p id="sheetKind" class="sheet-kind"></p>
        <h2 id="sheetTitle"></h2>
        <p id="sheetSub"></p>
      </div>
      <button type="button" class="icon" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>

<script src="/admin/admin.js" defer></script>
</body>
</html>
